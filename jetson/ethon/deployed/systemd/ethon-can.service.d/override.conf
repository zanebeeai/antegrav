[Service]
# can0 rides an SN65HVD230 (max ~1 Mbps). The stock unit's CAN-FD 2 Mbps data
# phase is un-drivable by that transceiver -> TX bus-off. FRC-mode Krakens speak
# classic 1 Mbps, so bring the bus up classic. (fixed 2026-07-03)
ExecStart=
ExecStart=/usr/sbin/ip link set can0 up type can bitrate 1000000 restart-ms 100
